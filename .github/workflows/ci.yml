name: "CI"

"on": ["pull_request"]

permissions:
  contents: "read"

jobs:
  ci:
    name: "CI à compléter"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v7.0.1"
      - name: "Configurer l'environnement"
        uses: "astral-sh/setup-uv@v10.2.0"
        with:
          python-version: "3.13"
          enable-cache: false
          persist-credentials: false
      - name: "Installer les dépendances"
        run: |
          uv sync --locked
  format:
    name: "Format"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v7.0.1"
      - name: "Configurer l'environnement"
        uses: "astral-sh/setup-uv@v10.2.0"
        with:
          python-version: "3.13"
          enable-cache: false
          persist-credentials: false
      - name: "Vérifier le formatage du code"
        run: |
          uv run black --check src tests

  unit-tests:
    name: "Format"
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v7.0.1"
      - name: "Configurer l'environnement"
        uses: "astral-sh/setup-uv@v10.2.0"
        with:
          python-version: "3.13"
          enable-cache: false
          persist-credentials: false
      - name: "lances les tests unitaires"
        run: |
          uv run pytest tests/unit -v

      # À compléter pendant le TD : environnement, dépendances et vérifications.

