name: "CI"

"on": ["pull_request", "push"]

permissions:
  contents: "read"

jobs:
  unit-tests:
    name: "test unitaires"
    strategy:
      matrix:
        python-version: ["3.13"]
    runs-on: "ubuntu-latest"
    timeout-minutes: 5
    steps:
      - name: "Récupérer le code"
        uses: "actions/checkout@v7.0.1"
      - name: "Configurer l'environnement"
        uses: "astral-sh/setup-uv@v10.2.0"
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
          persist-credentials: false
      - name: "lances les tests unitaires + dependances"
        run: |
          uv sync --locked
          uv run pytest tests/unit -v
          uv run ruff check .
          uv run ruff format --check .

      # À compléter pendant le TD : environnement, dépendances et vérifications.

